name: Atlas browser smoke tests
on:
  push:
    branches: [feature/usgs-live-observations]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve Atlas
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/atlas.log 2>&1 &
      - name: Test demo and mocked live feed
        run: node tests/smoke.cjs
