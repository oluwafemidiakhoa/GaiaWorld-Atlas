name: Atlas browser smoke tests
on:
  push:
    branches: [feature/usgs-live-observations]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve Atlas
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/atlas.log 2>&1 &
      - name: Test demo, import/export and failure recovery
        run: node tests/smoke.cjs
      - name: Check official USGS feed availability and schema
        run: |
          node - <<'NODE'
          (async()=>{
            const response=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',{signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('USGS HTTP '+response.status);
            const body=await response.json();
            if(body.type!=='FeatureCollection'||!Array.isArray(body.features)||!Number.isFinite(body.metadata?.generated))throw Error('Invalid USGS schema');
            console.log('PASS: live USGS feed schema; generated '+new Date(body.metadata.generated).toISOString()+'; events '+body.features.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Check real USGS water-monitoring station
        run: |
          node - <<'NODE'
          (async () => {
            const url='https://api.waterdata.usgs.gov/ogcapi/v1/collections/latest-continuous/items?f=json&monitoring_location_id=USGS-01491000&parameter_code=00060&limit=5';
            const res=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!res.ok)throw Error('Water API HTTP '+res.status);
            const body=await res.json();
            if(!Array.isArray(body.features))throw Error('Unexpected water response schema');
            if(!body.features.length)throw Error('Reference station returned no measurements');
            const point=body.features.find(f=>f.geometry?.type==='Point'&&Array.isArray(f.geometry.coordinates));
            if(!point)throw Error('No point geometry returned');
            const p=point.properties||{};
            if(!('value' in p)||!('time' in p))throw Error('Missing measurement/time');
            console.log('PASS water station',p.monitoring_location_id,p.value,p.unit_of_measure,p.time);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
